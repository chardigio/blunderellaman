<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>blunderellaman shorts queue</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16133A;
  --board-light:#DCD6F7;
  --pink:#FF4F9A;
  --text:#F6F4FF;
  --muted:#B4ADE0;
  --panel:#1E1A4A;
  --line:#3A3478;
  --loss:#FF6B6B;
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
main{max-width:760px;margin:0 auto;padding:max(32px,env(safe-area-inset-top)) 16px 56px}
h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.03em}
h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.01em}
a{color:var(--board-light)}
[hidden]{display:none!important}
button,input{font:inherit}
button{
  background:transparent;color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;
}
button:hover{border-color:var(--pink)}
button.primary{background:var(--pink);border-color:var(--pink);color:var(--ink)}
button.small{padding:3px 8px;font-size:12px}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
input{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink);color:var(--text);font-size:16px;min-width:0;
}
input[type=datetime-local]{color-scheme:dark}

/* sign-in, drawn by BlunderApi.mountSignIn */
.bl-signin{max-width:380px;margin:12vh auto 0;display:grid;gap:14px}
.bl-signin p{margin:0;color:var(--muted)}
.bl-signin input{padding:12px 14px;border-radius:12px;background:var(--panel);font-size:17px}
.bl-signin button[type=submit]{background:var(--pink);border-color:var(--pink);color:var(--ink);padding:12px}
.bl-signin .bl-back{justify-self:start;border:none;padding:0;color:var(--muted);font-weight:400;text-decoration:underline}
.bl-signin .bl-error{color:var(--loss);font-size:14px}

/* page */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head .sub{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.head .links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#summary{font-size:18px;font-weight:600;margin:14px 0 6px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
#status{font-size:14px;color:var(--muted);margin:6px 0 0;min-height:1.45em}
#status.error{color:var(--loss)}
#page.busy .actions button{pointer-events:none;opacity:.6}

.group{margin-top:28px}
.group .hint{margin:0 0 12px;font-size:14px;color:var(--muted)}
.group .empty{margin:0;color:var(--muted);font-size:14px}

.clip{
  display:grid;grid-template-columns:160px minmax(0,1fr);gap:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;
}
.clip.due{border-color:var(--pink)}
.clip video,.clip .novideo{width:160px;aspect-ratio:9/16;border-radius:10px;background:#000;display:block;object-fit:cover}
.clip .novideo{display:grid;place-items:center;color:var(--muted);font-size:13px}
.clip .body{display:grid;gap:10px;align-content:start;min-width:0}
.clip .when{font-weight:800;font-size:18px}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{margin:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--loss);font-size:13px;flex-basis:100%}
.copyrow{display:flex;gap:8px;align-items:center;min-width:0}
.copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font-size:14px;font-family:var(--font)}
.download{font-size:14px}
@media (max-width:560px){
  .clip{grid-template-columns:1fr}
  .clip video,.clip .novideo{width:auto;height:52vh;max-width:100%;margin:0 auto}
}

.done{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.done-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.done-row:first-child{border-top:none}
.done-row strong{overflow-wrap:anywhere}
.plat{font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<main>
  <div id="signin" hidden></div>

  <div id="page" hidden>
    <div class="head">
      <div>
        <h1>Shorts queue</h1>
        <div class="sub" id="who"></div>
      </div>
      <div class="links">
        <a href="/admin/">Stats</a>
        <a href="/admin/bot/">blunderbot</a>
        <button type="button" id="signout">Sign out</button>
      </div>
    </div>
    <p id="summary" aria-live="polite"></p>
    <p id="status" role="status" hidden></p>
    <div id="groups"></div>
  </div>
</main>
<script src="/admin/api.js"></script>
<script src="/admin/queue/queue.js"></script>
<script>BlunderQueue.start(document);</script>
</body>
</html>
